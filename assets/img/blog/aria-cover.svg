<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .fd { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; }
      .fm { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0a0908"/>

  <rect x="0" y="0"   width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="90"  width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="180" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="270" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="360" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="450" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="540" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>

  <text x="64" y="480" class="fd" font-size="320" fill="#f3b02e" opacity="0.06">34%</text>

  <line x1="700" y1="72" x2="700" y2="558" stroke="#f3b02e" stroke-width="1" opacity="0.1"/>

  <!-- LEFT COLUMN -->
  <rect x="72" y="72" width="178" height="28" fill="rgba(243,176,47,0.08)" stroke="rgba(243,176,47,0.28)" stroke-width="1"/>
  <text x="84" y="91" class="fm" font-size="10" fill="#f3b02e" letter-spacing="3">ACCESSIBILITY</text>

  <rect x="72" y="120" width="220" height="2" fill="#f3b02e"/>

  <text x="68" y="212" class="fd" font-size="62" fill="#f0ebe0">WHAT IS ARIA,</text>
  <text x="68" y="280" class="fd" font-size="46" fill="#f3b02e">AND WHY DESIGNERS NEED IT</text>

  <text x="72" y="328" class="fm" font-size="13" fill="#8a8678">Roles, states, properties, and the first rule</text>
  <text x="72" y="348" class="fm" font-size="13" fill="#8a8678">that prevents most ARIA from making things worse.</text>

  <text x="72" y="580" class="fm" font-size="10" fill="#3a3733" letter-spacing="2">CRISTOFOLINI.SITE — INSIGHTS — JUL 2026</text>

  <!-- RIGHT COLUMN -->
  <text x="736" y="114" class="fm" font-size="9" fill="#474440" letter-spacing="3">THREE ARIA CATEGORIES</text>
  <rect x="736" y="122" width="392" height="1" fill="rgba(255,255,255,0.07)"/>

  <rect x="736" y="150" width="392" height="92" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="756" y="178" class="fm" font-size="11" fill="#f3b02e" letter-spacing="2">ROLES</text>
  <text x="756" y="200" class="fm" font-size="10" fill="#8a8678">role="dialog"  role="tablist"</text>
  <text x="756" y="218" class="fm" font-size="9" fill="#474440">what an element IS</text>

  <rect x="736" y="254" width="392" height="92" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="756" y="282" class="fm" font-size="11" fill="#f0ebe0" letter-spacing="2">STATES</text>
  <text x="756" y="304" class="fm" font-size="10" fill="#8a8678">aria-expanded  aria-checked</text>
  <text x="756" y="322" class="fm" font-size="9" fill="#474440">what changes during use</text>

  <rect x="736" y="358" width="392" height="92" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="756" y="386" class="fm" font-size="11" fill="#8a8678" letter-spacing="2">PROPERTIES</text>
  <text x="756" y="408" class="fm" font-size="10" fill="#8a8678">aria-label  aria-describedby</text>
  <text x="756" y="426" class="fm" font-size="9" fill="#474440">what it's connected to</text>

  <rect x="736" y="470" width="392" height="1" fill="rgba(255,255,255,0.07)"/>
  <text x="736" y="488" class="fm" font-size="9" fill="#2e2c29" letter-spacing="1">ARIA CHANGES WHAT'S ANNOUNCED, NOT WHAT HAPPENS.</text>
</svg>
