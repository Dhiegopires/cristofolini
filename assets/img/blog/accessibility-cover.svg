<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .fd { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; }
      .fm { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
      .fs { font-family: 'Syne', 'Arial', sans-serif; font-weight: 800; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0908"/>

  <!-- Subtle horizontal scan lines for texture -->
  <rect x="0" y="0"   width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="90"  width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="180" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="270" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="360" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="450" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="540" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>

  <!-- Giant background stat — amber ghost -->
  <text x="64" y="480" class="fd" font-size="320" fill="#f3b02e" opacity="0.06">94.8</text>

  <!-- Vertical divider -->
  <line x1="700" y1="72" x2="700" y2="558" stroke="#f3b02e" stroke-width="1" opacity="0.1"/>

  <!-- ─── LEFT COLUMN ─── -->

  <!-- Tag -->
  <rect x="72" y="72" width="178" height="28" fill="rgba(243,176,47,0.08)" stroke="rgba(243,176,47,0.28)" stroke-width="1"/>
  <text x="84" y="91" class="fm" font-size="10" fill="#f3b02e" letter-spacing="3">ACCESSIBILITY</text>

  <!-- Amber accent line under tag -->
  <rect x="72" y="120" width="220" height="2" fill="#f3b02e"/>

  <!-- Title line 1 — white -->
  <text x="68" y="212" class="fd" font-size="62" fill="#f0ebe0">ACCESSIBILITY FAILURES</text>
  <!-- Title line 2 — amber -->
  <text x="68" y="280" class="fd" font-size="62" fill="#f3b02e">ARE DESIGN DECISIONS.</text>

  <!-- Subtitle -->
  <text x="72" y="328" class="fm" font-size="13" fill="#8a8678">The same 6 error categories cause 96% of all</text>
  <text x="72" y="348" class="fm" font-size="13" fill="#8a8678">accessibility failures. Every year since 2019.</text>

  <!-- Attribution -->
  <text x="72" y="580" class="fm" font-size="10" fill="#3a3733" letter-spacing="2">CRISTOFOLINI.SITE — INSIGHTS — JUL 2026</text>

  <!-- ─── RIGHT COLUMN — DATA VIZ ─── -->

  <!-- Section label + rule -->
  <text x="736" y="114" class="fm" font-size="9" fill="#474440" letter-spacing="3">WEBAIM MILLION 2025 — TOP 1M HOMEPAGES</text>
  <rect x="736" y="122" width="392" height="1" fill="rgba(255,255,255,0.07)"/>

  <!-- Bar 1: Low contrast text: 79.1% — max bar width = 392px -->
  <text x="736" y="162" class="fm" font-size="9" fill="#8a8678" letter-spacing="1">LOW CONTRAST TEXT</text>
  <rect x="736" y="168" width="392" height="16" fill="rgba(255,255,255,0.03)"/>
  <rect x="736" y="168" width="310" height="16" fill="#f3b02e" opacity="0.80"/>
  <text x="1136" y="181" class="fm" font-size="11" fill="#f3b02e" text-anchor="end">79.1%</text>

  <!-- Bar 2: Missing alt text: 54.5% -->
  <text x="736" y="208" class="fm" font-size="9" fill="#8a8678" letter-spacing="1">MISSING ALT TEXT</text>
  <rect x="736" y="214" width="392" height="16" fill="rgba(255,255,255,0.03)"/>
  <rect x="736" y="214" width="214" height="16" fill="#f3b02e" opacity="0.55"/>
  <text x="1136" y="227" class="fm" font-size="11" fill="#8a8678" text-anchor="end">54.5%</text>

  <!-- Bar 3: Missing form labels: 48.6% -->
  <text x="736" y="254" class="fm" font-size="9" fill="#8a8678" letter-spacing="1">MISSING FORM LABELS</text>
  <rect x="736" y="260" width="392" height="16" fill="rgba(255,255,255,0.03)"/>
  <rect x="736" y="260" width="191" height="16" fill="#f3b02e" opacity="0.50"/>
  <text x="1136" y="273" class="fm" font-size="11" fill="#8a8678" text-anchor="end">48.6%</text>

  <!-- Bar 4: Empty links: 44.6% -->
  <text x="736" y="300" class="fm" font-size="9" fill="#8a8678" letter-spacing="1">EMPTY LINKS</text>
  <rect x="736" y="306" width="392" height="16" fill="rgba(255,255,255,0.03)"/>
  <rect x="736" y="306" width="175" height="16" fill="#f3b02e" opacity="0.45"/>
  <text x="1136" y="319" class="fm" font-size="11" fill="#8a8678" text-anchor="end">44.6%</text>

  <!-- Bar 5: Missing language: 28.0% -->
  <text x="736" y="346" class="fm" font-size="9" fill="#8a8678" letter-spacing="1">MISSING DOCUMENT LANGUAGE</text>
  <rect x="736" y="352" width="392" height="16" fill="rgba(255,255,255,0.03)"/>
  <rect x="736" y="352" width="110" height="16" fill="#f3b02e" opacity="0.35"/>
  <text x="1136" y="365" class="fm" font-size="11" fill="#8a8678" text-anchor="end">28.0%</text>

  <!-- Bar 6: Empty buttons: 27.5% -->
  <text x="736" y="392" class="fm" font-size="9" fill="#8a8678" letter-spacing="1">EMPTY BUTTONS</text>
  <rect x="736" y="398" width="392" height="16" fill="rgba(255,255,255,0.03)"/>
  <rect x="736" y="398" width="108" height="16" fill="#f3b02e" opacity="0.35"/>
  <text x="1136" y="411" class="fm" font-size="11" fill="#8a8678" text-anchor="end">27.5%</text>

  <!-- Note -->
  <rect x="736" y="438" width="392" height="1" fill="rgba(255,255,255,0.07)"/>
  <text x="736" y="456" class="fm" font-size="9" fill="#2e2c29" letter-spacing="1">THESE 6 CATEGORIES = 96% OF ALL FAILURES</text>
</svg>
