<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .fd { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; }
      .fm { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0a0908"/>

  <rect x="0" y="0"   width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="90"  width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="180" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="270" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="360" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="450" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="540" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>

  <text x="64" y="480" class="fd" font-size="320" fill="#f3b02e" opacity="0.06">78%</text>

  <line x1="700" y1="72" x2="700" y2="558" stroke="#f3b02e" stroke-width="1" opacity="0.1"/>

  <!-- LEFT COLUMN -->
  <rect x="72" y="72" width="178" height="28" fill="rgba(243,176,47,0.08)" stroke="rgba(243,176,47,0.28)" stroke-width="1"/>
  <text x="84" y="91" class="fm" font-size="10" fill="#f3b02e" letter-spacing="3">ACCESSIBILITY</text>

  <rect x="72" y="120" width="220" height="2" fill="#f3b02e"/>

  <text x="68" y="200" class="fd" font-size="50" fill="#f0ebe0">KEYBOARD NAVIGATION</text>
  <text x="68" y="270" class="fd" font-size="44" fill="#f3b02e">TEST IT WITHOUT THE MOUSE</text>

  <text x="72" y="328" class="fm" font-size="13" fill="#8a8678">Tab order, focus indicators, focus traps,</text>
  <text x="72" y="348" class="fm" font-size="13" fill="#8a8678">and the skip link, done right.</text>

  <text x="72" y="580" class="fm" font-size="10" fill="#3a3733" letter-spacing="2">CRISTOFOLINI.SITE — INSIGHTS — JUL 2026</text>

  <!-- RIGHT COLUMN — tab sequence readout -->
  <text x="736" y="114" class="fm" font-size="9" fill="#474440" letter-spacing="3">SAME LAYOUT, TWO TAB SEQUENCES</text>
  <rect x="736" y="122" width="392" height="1" fill="rgba(255,255,255,0.07)"/>

  <text x="736" y="156" class="fm" font-size="10" fill="#8a8678" letter-spacing="1">VISUAL ORDER</text>
  <rect x="736" y="166" width="88" height="36" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="780" y="189" class="fm" font-size="13" fill="#f0ebe0" text-anchor="middle">1</text>
  <rect x="834" y="166" width="88" height="36" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="878" y="189" class="fm" font-size="13" fill="#f0ebe0" text-anchor="middle">2</text>
  <rect x="932" y="166" width="88" height="36" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="976" y="189" class="fm" font-size="13" fill="#f0ebe0" text-anchor="middle">3</text>
  <rect x="1030" y="166" width="98" height="36" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="1079" y="189" class="fm" font-size="13" fill="#f0ebe0" text-anchor="middle">4</text>

  <text x="736" y="240" class="fm" font-size="10" fill="#f3b02e" letter-spacing="1">ACTUAL TAB SEQUENCE</text>
  <rect x="736" y="250" width="88" height="36" fill="rgba(243,176,47,0.1)" stroke="#f3b02e" stroke-width="2"/>
  <text x="780" y="273" class="fm" font-size="13" fill="#f3b02e" text-anchor="middle">2</text>
  <rect x="834" y="250" width="88" height="36" fill="rgba(243,176,47,0.1)" stroke="#f3b02e" stroke-width="2"/>
  <text x="878" y="273" class="fm" font-size="13" fill="#f3b02e" text-anchor="middle">4</text>
  <rect x="932" y="250" width="88" height="36" fill="rgba(243,176,47,0.1)" stroke="#f3b02e" stroke-width="2"/>
  <text x="976" y="273" class="fm" font-size="13" fill="#f3b02e" text-anchor="middle">1</text>
  <rect x="1030" y="250" width="98" height="36" fill="rgba(243,176,47,0.1)" stroke="#f3b02e" stroke-width="2"/>
  <text x="1079" y="273" class="fm" font-size="13" fill="#f3b02e" text-anchor="middle">3</text>

  <rect x="736" y="470" width="392" height="1" fill="rgba(255,255,255,0.07)"/>
  <text x="736" y="488" class="fm" font-size="9" fill="#2e2c29" letter-spacing="1">CSS REORDERS THE LOOK. THE DOM DECIDES TAB.</text>
</svg>
