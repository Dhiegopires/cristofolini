<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      .fd { font-family: 'Bebas Neue', 'Arial Narrow', Arial, sans-serif; }
      .fm { font-family: 'IBM Plex Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0908"/>

  <!-- Subtle horizontal scan lines for texture -->
  <rect x="0" y="0"   width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="90"  width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="180" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="270" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="360" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="450" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>
  <rect x="0" y="540" width="1200" height="1" fill="#f3b02e" opacity="0.04"/>

  <!-- Giant background stat — amber ghost -->
  <text x="64" y="480" class="fd" font-size="320" fill="#f3b02e" opacity="0.06">7:1</text>

  <!-- Vertical divider -->
  <line x1="700" y1="72" x2="700" y2="558" stroke="#f3b02e" stroke-width="1" opacity="0.1"/>

  <!-- ─── LEFT COLUMN ─── -->

  <!-- Tag -->
  <rect x="72" y="72" width="178" height="28" fill="rgba(243,176,47,0.08)" stroke="rgba(243,176,47,0.28)" stroke-width="1"/>
  <text x="84" y="91" class="fm" font-size="10" fill="#f3b02e" letter-spacing="3">ACCESSIBILITY</text>

  <!-- Amber accent line under tag -->
  <rect x="72" y="120" width="220" height="2" fill="#f3b02e"/>

  <!-- Title line 1 — white -->
  <text x="68" y="212" class="fd" font-size="62" fill="#f0ebe0">AA VS AAA:</text>
  <!-- Title line 2 — amber -->
  <text x="68" y="280" class="fd" font-size="50" fill="#f3b02e">WHAT THE LEVELS MEAN</text>

  <!-- Subtitle -->
  <text x="72" y="328" class="fm" font-size="13" fill="#8a8678">How the contrast ratio is calculated, where each</text>
  <text x="72" y="348" class="fm" font-size="13" fill="#8a8678">threshold applies, and why disabled buttons fail both.</text>

  <!-- Attribution -->
  <text x="72" y="580" class="fm" font-size="10" fill="#3a3733" letter-spacing="2">CRISTOFOLINI.SITE — INSIGHTS — JUL 2026</text>

  <!-- ─── RIGHT COLUMN — CONTRAST SCALE VIZ ─── -->

  <!-- Section label + rule -->
  <text x="736" y="114" class="fm" font-size="9" fill="#474440" letter-spacing="3">WCAG 2.2 CONTRAST RATIO SCALE — 1:1 TO 21:1</text>
  <rect x="736" y="122" width="392" height="1" fill="rgba(255,255,255,0.07)"/>

  <!-- Scale track -->
  <rect x="736" y="220" width="392" height="20" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- gradient fill representing luminance difference growth -->
  <rect x="736" y="220" width="392" height="20" fill="url(#scaleGrad)"/>

  <linearGradient id="scaleGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%"  stop-color="#3a3733"/>
    <stop offset="100%" stop-color="#f3b02e"/>
  </linearGradient>

  <!-- Tick: 3:1 AA large text at (3-1)/20 = 10% -->
  <line x1="775.2" y1="210" x2="775.2" y2="250" stroke="#f0ebe0" stroke-width="1" opacity="0.5"/>
  <text x="775.2" y="200" class="fm" font-size="9" fill="#8a8678" text-anchor="middle">3:1</text>

  <!-- Tick: 4.5:1 AA normal text at 3.5/20 = 17.5% -->
  <line x1="805" y1="210" x2="805" y2="250" stroke="#f0ebe0" stroke-width="1" opacity="0.7"/>
  <text x="805" y="200" class="fm" font-size="9" fill="#f0ebe0" text-anchor="middle">4.5:1</text>

  <!-- Tick: 7:1 AAA normal text at 6/20 = 30% -->
  <line x1="853.6" y1="210" x2="853.6" y2="250" stroke="#f3b02e" stroke-width="1.5"/>
  <text x="853.6" y="200" class="fm" font-size="9" fill="#f3b02e" text-anchor="middle">7:1</text>

  <text x="736" y="270" class="fm" font-size="9" fill="#474440" text-anchor="start">1:1</text>
  <text x="1128" y="270" class="fm" font-size="9" fill="#474440" text-anchor="end">21:1</text>

  <!-- Three swatch rows below -->
  <text x="736" y="320" class="fm" font-size="9" fill="#8a8678" letter-spacing="1">#9CA3AF ON #FFFFFF</text>
  <rect x="736" y="326" width="392" height="16" fill="rgba(255,255,255,0.03)"/>
  <rect x="736" y="326" width="56" height="16" fill="#8a8678" opacity="0.6"/>
  <text x="1136" y="339" class="fm" font-size="11" fill="#8a8678" text-anchor="end">2.85:1 · FAILS</text>

  <text x="736" y="366" class="fm" font-size="9" fill="#8a8678" letter-spacing="1">#767676 ON #FFFFFF</text>
  <rect x="736" y="372" width="392" height="16" fill="rgba(255,255,255,0.03)"/>
  <rect x="736" y="372" width="196" height="16" fill="#f3b02e" opacity="0.55"/>
  <text x="1136" y="385" class="fm" font-size="11" fill="#f0ebe0" text-anchor="end">4.54:1 · AA</text>

  <text x="736" y="412" class="fm" font-size="9" fill="#8a8678" letter-spacing="1">#595959 ON #FFFFFF</text>
  <rect x="736" y="418" width="392" height="16" fill="rgba(255,255,255,0.03)"/>
  <rect x="736" y="418" width="392" height="16" fill="#f3b02e" opacity="0.85"/>
  <text x="1136" y="431" class="fm" font-size="11" fill="#f3b02e" text-anchor="end">7.0:1 · AAA</text>

  <!-- Note -->
  <rect x="736" y="470" width="392" height="1" fill="rgba(255,255,255,0.07)"/>
  <text x="736" y="488" class="fm" font-size="9" fill="#2e2c29" letter-spacing="1">SAME BACKGROUND. ONLY THE GRAY GOT DARKER.</text>
</svg>
