<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Five token layers stacked: Core, Palette, Brand, Semantic, Component. A dashed line after Semantic marks where a small product stops.">
  <rect width="1200" height="560" fill="#040404"/>
  <g font-family="Lato, system-ui, sans-serif">
    <g transform="translate(120 70)">
      <rect width="720" height="64" fill="#171826"/>
      <rect width="6" height="64" fill="#fcc000"/>
      <text x="32" y="40" fill="#f0f1f7" font-size="24" font-weight="700">Core</text>
      <text x="760" y="40" fill="#9b9db0" font-size="18">raw values</text>
    </g>
    <g transform="translate(120 152)">
      <rect width="720" height="64" fill="#171826"/>
      <rect width="6" height="64" fill="#fcc000"/>
      <text x="32" y="40" fill="#f0f1f7" font-size="24" font-weight="700">Palette</text>
      <text x="760" y="40" fill="#9b9db0" font-size="18">named ramps</text>
    </g>
    <g transform="translate(120 234)">
      <rect width="720" height="64" fill="#171826"/>
      <rect width="6" height="64" fill="#fcc000"/>
      <text x="32" y="40" fill="#f0f1f7" font-size="24" font-weight="700">Brand</text>
      <text x="760" y="40" fill="#9b9db0" font-size="18">the one you re-theme</text>
    </g>
    <g transform="translate(120 316)">
      <rect width="720" height="64" fill="#171826"/>
      <rect width="6" height="64" fill="#fcc000"/>
      <text x="32" y="40" fill="#f0f1f7" font-size="24" font-weight="700">Semantic</text>
      <text x="760" y="40" fill="#9b9db0" font-size="18">meaning, not colour</text>
    </g>

    <line x1="90" y1="404" x2="1110" y2="404" stroke="#fcc000" stroke-width="2" stroke-dasharray="10 8"/>
    <text x="90" y="392" fill="#fcc000" font-size="16" font-weight="700" letter-spacing="1.5">SMALL PRODUCT STOPS HERE</text>

    <g transform="translate(120 430)">
      <rect width="720" height="64" fill="none" stroke="#3a3b47" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="32" y="40" fill="#6f7183" font-size="24" font-weight="700">Component</text>
      <text x="760" y="40" fill="#6f7183" font-size="18">the layer I did not need</text>
    </g>
  </g>
</svg>
