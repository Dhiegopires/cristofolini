<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- bg -->
  <rect width="880" height="300" rx="10" fill="#0f0d0a"/>

  <!-- ─── TOKEN 1 ─────────────────────────────────────── -->
  <rect x="24" y="24" width="248" height="252" rx="6" fill="#181612" stroke="#2a2520" stroke-width="1"/>
  <rect x="24" y="24" width="248" height="3" rx="1.5" fill="#f3b02e"/>

  <text x="44" y="68" font-family="'Bebas Neue',Georgia,serif" font-size="36" fill="#f3b02e">01</text>
  <text x="44" y="96" font-family="system-ui,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#f0ebe0" text-transform="uppercase">BOOKING TOKEN</text>

  <line x1="44" y1="110" x2="256" y2="110" stroke="#2a2520" stroke-width="1"/>

  <text x="44" y="136" font-family="system-ui,'Segoe UI',sans-serif" font-size="11" fill="#8a8678">Generated at payment confirmation</text>
  <text x="44" y="156" font-family="system-ui,'Segoe UI',sans-serif" font-size="11" fill="#8a8678">Held by: Patient</text>

  <text x="44" y="196" font-family="system-ui,'Segoe UI',sans-serif" font-size="12" fill="#f0ebe0">Secures the appointment.</text>
  <text x="44" y="214" font-family="system-ui,'Segoe UI',sans-serif" font-size="12" fill="#f0ebe0">Escrow activates. Clinic</text>
  <text x="44" y="232" font-family="system-ui,'Segoe UI',sans-serif" font-size="12" fill="#f0ebe0">receives booking alert.</text>

  <rect x="44" y="248" width="120" height="20" rx="3" fill="#1e1a0f"/>
  <text x="104" y="261" font-family="system-ui,'Segoe UI',sans-serif" font-size="10" fill="#f3b02e" text-anchor="middle">Escrow activated</text>

  <!-- arrow 1→2 -->
  <line x1="272" y1="150" x2="302" y2="150" stroke="#8a8678" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="302,144 316,150 302,156" fill="#8a8678"/>

  <!-- ─── TOKEN 2 ─────────────────────────────────────── -->
  <rect x="316" y="24" width="248" height="252" rx="6" fill="#181612" stroke="#2a2520" stroke-width="1"/>
  <rect x="316" y="24" width="248" height="3" rx="1.5" fill="#f3b02e"/>

  <text x="336" y="68" font-family="'Bebas Neue',Georgia,serif" font-size="36" fill="#f3b02e">02</text>
  <text x="336" y="96" font-family="system-ui,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#f0ebe0" text-transform="uppercase">BILATERAL CHECK-IN</text>

  <line x1="336" y1="110" x2="548" y2="110" stroke="#2a2520" stroke-width="1"/>

  <text x="336" y="136" font-family="system-ui,'Segoe UI',sans-serif" font-size="11" fill="#8a8678">Generated at professional assignment</text>
  <text x="336" y="156" font-family="system-ui,'Segoe UI',sans-serif" font-size="11" fill="#8a8678">Held by: Patient + Professional</text>

  <text x="336" y="196" font-family="system-ui,'Segoe UI',sans-serif" font-size="12" fill="#f0ebe0">Codes exchanged at the</text>
  <text x="336" y="214" font-family="system-ui,'Segoe UI',sans-serif" font-size="12" fill="#f0ebe0">front door. Mutual identity</text>
  <text x="336" y="232" font-family="system-ui,'Segoe UI',sans-serif" font-size="12" fill="#f0ebe0">confirmed before entry.</text>

  <rect x="336" y="248" width="136" height="20" rx="3" fill="#1e1a0f"/>
  <text x="404" y="261" font-family="system-ui,'Segoe UI',sans-serif" font-size="10" fill="#f3b02e" text-anchor="middle">Identity verified</text>

  <!-- arrow 2→3 -->
  <line x1="564" y1="150" x2="594" y2="150" stroke="#8a8678" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="594,144 608,150 594,156" fill="#8a8678"/>

  <!-- ─── TOKEN 3 ─────────────────────────────────────── -->
  <rect x="608" y="24" width="248" height="252" rx="6" fill="#181612" stroke="#2a2520" stroke-width="1"/>
  <rect x="608" y="24" width="248" height="3" rx="1.5" fill="#f3b02e"/>

  <text x="628" y="68" font-family="'Bebas Neue',Georgia,serif" font-size="36" fill="#f3b02e">03</text>
  <text x="628" y="96" font-family="system-ui,'Segoe UI',sans-serif" font-size="11" font-weight="700" letter-spacing="0.1em" fill="#f0ebe0" text-transform="uppercase">COMPLETION TOKEN</text>

  <line x1="628" y1="110" x2="840" y2="110" stroke="#2a2520" stroke-width="1"/>

  <text x="628" y="136" font-family="system-ui,'Segoe UI',sans-serif" font-size="11" fill="#8a8678">Generated at service end</text>
  <text x="628" y="156" font-family="system-ui,'Segoe UI',sans-serif" font-size="11" fill="#8a8678">Confirmed by: Patient</text>

  <text x="628" y="196" font-family="system-ui,'Segoe UI',sans-serif" font-size="12" fill="#f0ebe0">Professional submits code.</text>
  <text x="628" y="214" font-family="system-ui,'Segoe UI',sans-serif" font-size="12" fill="#f0ebe0">Patient confirms. Service</text>
  <text x="628" y="232" font-family="system-ui,'Segoe UI',sans-serif" font-size="12" fill="#f0ebe0">documented. Escrow released.</text>

  <rect x="628" y="248" width="136" height="20" rx="3" fill="#1e1a0f"/>
  <text x="696" y="261" font-family="system-ui,'Segoe UI',sans-serif" font-size="10" fill="#f3b02e" text-anchor="middle">Escrow released</text>
</svg>
